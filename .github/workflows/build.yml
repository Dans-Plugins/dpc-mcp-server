name: Build

on:
  push:
    branches: [ main ]
  pull_request:

# Nothing CI starts may report usage to the real trace server. npm test sets
# this for its own children too; this covers the steps that run the server
# directly. Containers get it with -e below.
env:
  TRACE_USAGE_REPORTING: "off"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [ '18', '20', '22' ]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Install dev dependencies
        run: npm install

      - name: Test
        run: npm test

      # The server must start with no dev dependencies present, because that is
      # how a user runs it.
      - name: Start with no dependencies installed
        run: |
          rm -rf node_modules
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}' \
            | node src/server.js > /tmp/out.json
          grep -q '"serverInfo"' /tmp/out.json
          echo "starts clean"

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the image
        run: docker build -t dpc-mcp-server:ci .

      # The no-runtime-dependency rule is a property of the image, not only of
      # the repository. An image carrying node_modules has stopped making the
      # claim the project exists to make.
      - name: No node_modules in the image
        run: |
          if docker run --rm --entrypoint sh dpc-mcp-server:ci -c 'test -e /app/node_modules'; then
            echo "node_modules is present in the image" >&2
            exit 1
          fi
          echo "no node_modules"

      - name: Does not run as root
        run: |
          who=$(docker run --rm --entrypoint id dpc-mcp-server:ci -un)
          echo "runs as $who"
          test "$who" != "root"

      # The healthcheck's cadence is a deployment choice; its command is the
      # part that breaks, so CI shortens the interval and tests the command.
      - name: Serve a session over HTTP
        run: |
          docker run -d --name mcp -p 8080:8080 \
            -e TRACE_USAGE_REPORTING=off \
            --health-interval=5s --health-start-period=2s \
            dpc-mcp-server:ci
          for _ in $(seq 1 24); do
            status=$(docker inspect --format '{{.State.Health.Status}}' mcp)
            if [ "$status" = "healthy" ] || [ "$status" = "unhealthy" ]; then break; fi
            sleep 5
          done
          docker inspect --format '{{.State.Health.Status}}' mcp | grep -qx healthy

          curl -sS -X POST http://127.0.0.1:8080/mcp \
            -H 'content-type: application/json' \
            -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}' \
            > /tmp/init.json
          cat /tmp/init.json
          grep -q '"serverInfo"' /tmp/init.json

          curl -sS -X POST http://127.0.0.1:8080/mcp \
            -H 'content-type: application/json' \
            -d '{"jsonrpc":"2.0","id":2,"method":"tools/call","params":{"name":"list_maps","arguments":{}}}' \
            > /tmp/maps.json
          grep -q '"content"' /tmp/maps.json

          curl -sS http://127.0.0.1:8080/healthz > /tmp/health.json
          cat /tmp/health.json
          grep -q '"status":"ok"' /tmp/health.json

      # The signal handler is tested at the process level in test/run.js, but
      # the bug it fixes lives in the container: PID 1 is what makes an
      # unhandled SIGTERM get ignored, and only `docker stop` exercises that.
      # Without the handler this waits out the ten-second grace period and the
      # container is SIGKILLed with exit code 137; with it, the process exits 0
      # in about a second. The bound leaves room for a slow runner and none for
      # the grace period.
      - name: docker stop returns promptly
        run: |
          start=$(date +%s)
          docker stop mcp
          elapsed=$(( $(date +%s) - start ))
          echo "docker stop took ${elapsed}s"
          test "$elapsed" -lt 5
          code=$(docker inspect --format '{{.State.ExitCode}}' mcp)
          echo "exit code $code"
          test "$code" -eq 0

      - name: Container logs
        if: always()
        run: docker logs mcp || true

  freshness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Advisory: the vendored snapshot drifting behind the published collection
      # is expected between syncs and must not block an unrelated change.
      - name: Is the vendored collection current?
        continue-on-error: true
        run: node tools/sync.js --check
